    "is_dawn": {{#if isDawn}}true{{else}}false{{/if}},
    "is_dusk": {{#if isDusk}}true{{else}}false{{/if}}
  }
}
"""

# weatherchange — change_in.{hours,minutes,seconds} sources the common
# tthh/tthm/tths fields, not the registry's weatherTthh/weatherTthm/
# weatherTths (never populated — weather.go only sets a "weatherTth" geo.TTH
# struct, never flattened under those names). cmd/processor/weather.go sets
# the base "tth" enrichment key from the same weather-change target
# (cleanUntil), so tthh/tthm/tths correctly carry the weather-change
# countdown here via the same generic computed-field flattening every other
# type uses (internal/dts/layered_view.go buildComputedFields).
[[entry]]
type = "weatherchange"
platform = "api"
id = "diadem"
template = """
{
