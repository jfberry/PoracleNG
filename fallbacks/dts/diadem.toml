# quest — reward_detail sources itemNames/monsterNames (joined display strings)
# rather than the registry's itemName/monsterName/monsterFullName, which are
# never populated as scalars (quest enrichment only ever produces the
# plural/array/joined-string forms — see internal/enrichment/quest.go). Top
# reward "shiny" flag is isShiny (registry lists "shiny", but the enrichment
# key is isShiny). xl_candy_amount is dropped entirely: this codebase's quest
# reward model has no XL-candy category (Candy and XL Candy aren't
# distinguished anywhere in QuestRewardData).
[[entry]]
type = "quest"
platform = "api"
id = "diadem"
template = """
{
  "pokestop_name": "{{pokestopName}}",
  "quest": "{{questString}}",
  "reward": "{{rewardString}}",
  "conditions": "{{conditionString}}",
  "condition_list": [{{#each conditionList}}{"type": {{#if type}}{{type}}{{else}}0{{/if}}, "name": "{{name}}", "formatted": "{{formatted}}"}{{#unless @last}},{{/unless}}{{/each}}],
  "reward_detail": {
    "dust_amount": {{#if dustAmount}}{{dustAmount}}{{else}}0{{/if}},
    "item_name": "{{itemNames}}",
    "item_amount": {{#if itemAmount}}{{itemAmount}}{{else}}0{{/if}},
    "monster_name": "{{monsterNames}}",
    "energy_amount": {{#if energyAmount}}{{energyAmount}}{{else}}0{{/if}},
    "candy_amount": {{#if candyAmount}}{{candyAmount}}{{else}}0{{/if}},
    "shiny": {{#if isShiny}}true{{else}}false{{/if}}
  },
  "static_map": "{{staticMap}}", "icon_url": "{{imgUrl}}",
  "map_urls": { "google": "{{googleMapUrl}}", "apple": "{{appleMapUrl}}" },
  "address": {
    "formatted": "{{addr}}", "city": "{{city}}", "country": "{{country}}",
    "country_code": "{{countryCode}}"
  },
  "time_remaining": {
    "hours": {{#if tthh}}{{tthh}}{{else}}0{{/if}}, "minutes": {{#if tthm}}{{tthm}}{{else}}0{{/if}},
    "seconds": {{#if tths}}{{tths}}{{else}}0{{/if}}
  },
  "sun": {
    "sunrise_display": "{{sunriseTime}}", "sunset_display": "{{sunsetTime}}",
    "is_night": {{#if isNight}}true{{else}}false{{/if}},
    "is_dawn": {{#if isDawn}}true{{else}}false{{/if}},
    "is_dusk": {{#if isDusk}}true{{else}}false{{/if}}
  }
}
"""

# questSummary — a digest, not a single alert (see design doc §1.7.4). Each
# entries[] row is a full per-pokestop quest view (BuildQuestSummaryView
# collects the same merged base+perLang maps the "quest" type above uses), so
# the same reward_detail substitutions apply per-row.
[[entry]]
type = "questSummary"
platform = "api"
id = "diadem"
template = """
{
  "reward_type": {{#if rewardType}}{{rewardType}}{{else}}0{{/if}},
  "reward_id": {{#if reward}}{{reward}}{{else}}0{{/if}},
  "reward_form": {{#if rewardForm}}{{rewardForm}}{{else}}0{{/if}},
  "reward_name": "{{rewardName}}",
  "count": {{#if count}}{{count}}{{else}}0{{/if}},
  "chunk": {{#if chunk}}{{chunk}}{{else}}0{{/if}},
  "chunks": {{#if chunks}}{{chunks}}{{else}}0{{/if}},
  "static_map": "{{staticMap}}",
  "entries": [{{#each quests}}{
    "pokestop_name": "{{pokestopName}}",
    "latitude": {{#if latitude}}{{latitude}}{{else}}0{{/if}},
    "longitude": {{#if longitude}}{{longitude}}{{else}}0{{/if}},
    "quest": "{{questString}}",
    "reward": "{{rewardString}}",
    "reward_detail": {
      "dust_amount": {{#if dustAmount}}{{dustAmount}}{{else}}0{{/if}},
      "item_name": "{{itemNames}}",
      "item_amount": {{#if itemAmount}}{{itemAmount}}{{else}}0{{/if}},
      "monster_name": "{{monsterNames}}",
      "energy_amount": {{#if energyAmount}}{{energyAmount}}{{else}}0{{/if}},
      "candy_amount": {{#if candyAmount}}{{candyAmount}}{{else}}0{{/if}},
      "shiny": {{#if isShiny}}true{{else}}false{{/if}}
    }
  }{{#unless @last}},{{/unless}}{{/each}}]
}
"""

