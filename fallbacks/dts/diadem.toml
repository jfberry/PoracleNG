# fort-update — the DTS type name is "fort-update" (hyphenated; see
# cmd/processor/fort.go's TemplateType and dts_fields.go's fieldsByType key),
# not the bare "fort" used as shorthand in the task's type list. edit_types[]
# is dropped: the registry's editTypesList is never populated by enrichment
# (internal/enrichment/fort.go has no such key — the underlying data is only
# the individual isEdit* booleans, which don't safely reduce to a
# comma-correct JSON array in Handlebars alone). is_edit_image sources from
# isEditImageUrl, the real key fort.go sets (isEditImage does not exist).
# fort_id/fort_type/change_type are Type "string" in the registry — quoted.
[[entry]]
type = "fort-update"
platform = "api"
id = "diadem"
template = """
{
  "fort_id": "{{id}}",
  "fort_type": "{{fortType}}",
  "name": "{{name}}",
  "change_type": "{{changeType}}",
  "change_type_text": "{{changeTypeText}}",
  "is_edit_name": {{#if isEditName}}true{{else}}false{{/if}},
  "is_edit_location": {{#if isEditLocation}}true{{else}}false{{/if}},
  "is_edit_image": {{#if isEditImageUrl}}true{{else}}false{{/if}},
  "is_empty": {{#if isEmpty}}true{{else}}false{{/if}},
  "new_name": "{{newName}}",
  "old_name": "{{oldName}}",
  "new_description": "{{newDescription}}",
  "old_description": "{{oldDescription}}",
  "new_image_url": "{{newImageUrl}}",
  "old_image_url": "{{oldImageUrl}}",
  "static_map": "{{staticMap}}", "icon_url": "{{imgUrl}}",
  "map_urls": { "google": "{{googleMapUrl}}", "apple": "{{appleMapUrl}}" },
  "address": {
    "formatted": "{{addr}}", "city": "{{city}}", "country": "{{country}}",
    "country_code": "{{countryCode}}"
  },
  "time_remaining": {
    "hours": {{#if tthh}}{{tthh}}{{else}}0{{/if}}, "minutes": {{#if tthm}}{{tthm}}{{else}}0{{/if}},
    "seconds": {{#if tths}}{{tths}}{{else}}0{{/if}}
  },
  "sun": {
    "sunrise_display": "{{sunriseTime}}", "sunset_display": "{{sunsetTime}}",
    "is_night": {{#if isNight}}true{{else}}false{{/if}},
    "is_dawn": {{#if isDawn}}true{{else}}false{{/if}},
    "is_dusk": {{#if isDusk}}true{{else}}false{{/if}}
  }
}
"""

# maxbattle — pokestop_name sources gymName (max battles happen at gyms, not
# pokestops; the registry's own "pokestopName" is never set for this type).
# quick_move/charge_move are dropped: Max Battles use a "Max Moves" mechanic
# this codebase does not model as quick/charge moves (quickMoveName /
# chargeMoveName are never populated for maxbattle). total_stationed(_gmax)
# source the raw snake_case webhook keys (total_stationed_pokemon /
# total_stationed_gmax) — the camelCase registry names are never set and
# have no alias for this type.
[[entry]]
type = "maxbattle"
platform = "api"
id = "diadem"
template = """
{
  "pokemon_id": {{#if pokemonId}}{{pokemonId}}{{else}}0{{/if}},
  "name": "{{name}}",
  "full_name": "{{fullName}}",
  "costume_name": "{{costumeName}}",
  "level": {{#if level}}{{level}}{{else}}0{{/if}},
  "gmax": {{#if gmax}}true{{else}}false{{/if}},
  "pokestop_name": "{{gymName}}",
  "types": [{{#each typeNameEng}}"{{this}}"{{#unless @last}},{{/unless}}{{/each}}],
  "color": "{{color}}",
  "end_at": {{#if endTimestamp}}{{endTimestamp}}{{else}}0{{/if}},
  "end_display": "{{time}}",
  "total_stationed": {{#if total_stationed_pokemon}}{{total_stationed_pokemon}}{{else}}0{{/if}},
  "total_stationed_gmax": {{#if total_stationed_gmax}}{{total_stationed_gmax}}{{else}}0{{/if}},
  "static_map": "{{staticMap}}", "icon_url": "{{imgUrl}}",
  "map_urls": { "google": "{{googleMapUrl}}", "apple": "{{appleMapUrl}}" },
  "address": {
    "formatted": "{{addr}}", "city": "{{city}}", "country": "{{country}}",
    "country_code": "{{countryCode}}"
  },
  "time_remaining": {
    "hours": {{#if tthh}}{{tthh}}{{else}}0{{/if}}, "minutes": {{#if tthm}}{{tthm}}{{else}}0{{/if}},
    "seconds": {{#if tths}}{{tths}}{{else}}0{{/if}}
