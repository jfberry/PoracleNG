    "iv": {{#if (gte iv 0)}}{{iv}}{{else}}null{{/if}},
    "cp": {{#if cp}}{{cp}}{{else}}0{{/if}},
    "latitude": {{#if latitude}}{{latitude}}{{else}}0{{/if}},
